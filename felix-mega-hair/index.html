<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Demonstração · Prime Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.pexels.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Manrope:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--bg:#120c08;--surface:#1d140e;--line:#33251a;--ink:#fbf1e6;--muted:#c8b4a0;--accent:#ff8a1f;--accent-ink:#1a0d03;--soft:#2a1b10;--hero1:#2b1408;--hero2:#7a3810;--glow:#ff8a1f;
  --display:'Bricolage Grotesque',system-ui,sans-serif;--disp-w:800;--disp-style:normal;--disp-case:none;--body:'Manrope',system-ui,sans-serif;--prime:#0f8a4f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-inline:20px}

/* barra da demonstração */
.demo-bar{position:sticky;top:0;z-index:40;background:var(--prime);color:#fff;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:grid;gap:6px;justify-items:center;text-align:center;font:700 13px/1.3 'Manrope',sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.demo-bar .t{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center}
.demo-bar a{background:#fff;color:#0b5e36;border-radius:99px;padding:5px 12px;text-decoration:none;font-weight:800;white-space:nowrap}
.pbar{width:min(360px,100%);height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.pbar i{display:block;height:100%;width:20%;background:#fff;border-radius:9px;animation:grow 1.6s cubic-bezier(.2,.7,.2,1) both .4s}
@keyframes grow{from{width:0}}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:64px 92px;background:linear-gradient(170deg,var(--hero1),var(--bg) 80%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.b1{width:420px;height:420px;background:var(--hero2);right:-120px;top:-120px;animation:float1 14s ease-in-out infinite}
.b2{width:300px;height:300px;background:var(--glow);left:-140px;bottom:-120px;opacity:.28;animation:float2 18s ease-in-out infinite}
@keyframes float1{50%{transform:translate(-60px,50px) scale(1.12)}}
@keyframes float2{50%{transform:translate(80px,-40px) scale(1.2)}}
.hero .wrap{position:relative;z-index:2;display:grid;gap:18px}
.kicker{font:800 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;gap:8px;align-items:center}
.kicker::before{content:"";width:26px;height:2px;background:var(--accent)}
h1{font-family:var(--display);font-weight:var(--disp-w);font-style:var(--disp-style);text-transform:var(--disp-case);font-size:clamp(44px,10vw,96px);line-height:.92;letter-spacing:-.025em;margin:0;max-width:13ch;text-wrap:balance}
h1 .w{display:inline-block;margin-right:.22em}
.lead{font-size:clamp(17px,2.4vw,20px);color:var(--muted);max-width:50ch;margin:0}
.rating{display:inline-flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:800;width:fit-content}
.stars{position:relative;display:inline-block;letter-spacing:2px;color:color-mix(in srgb,var(--muted) 45%,transparent)}
.stars i{position:absolute;inset:0;width:var(--pct,0%);overflow:hidden;color:#ffc53d;font-style:normal;white-space:nowrap;transition:width 1.4s cubic-bezier(.2,.7,.2,1) .6s}
.rating span{color:var(--muted);font-weight:600}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{cursor:pointer;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:16px 24px;font:800 16px/1 var(--body);text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.main::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite 1.6s}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:20px;height:20px}
.orn{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:min(36vw,330px);aspect-ratio:1;z-index:1;pointer-events:none}
@media (max-width:760px){.orn{opacity:.25;right:-20%;width:70vw}}

/* ornamentos por nicho */
.pole{position:absolute;inset:8% 38%;border-radius:999px;background:repeating-linear-gradient(-45deg,#d9b26a 0 18px,#f4efe4 18px 36px,#9b2c2c 36px 54px,#f4efe4 54px 72px);background-size:100% 204px;animation:pole 2.4s linear infinite;box-shadow:0 0 0 10px #2e2a21,0 0 60px rgba(217,178,106,.35)}
@keyframes pole{to{background-position:0 204px}}
.spark{position:absolute;color:var(--accent);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1) rotate(90deg);opacity:1}}
.flt{position:absolute;color:var(--accent);opacity:.9;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-18px) rotate(8deg)}}
.ring{position:absolute;inset:15%;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ripple 3.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.orn svg{width:100%;height:100%}

/* faixa rolando */
.marquee{border-block:1px solid var(--line);background:var(--surface);overflow:hidden;padding-block:14px}
.track{display:flex;gap:40px;width:max-content;animation:marq 26s linear infinite}
.track span{font-family:var(--display);font-weight:var(--disp-w);font-style:var(--disp-style);text-transform:var(--disp-case);font-size:22px;white-space:nowrap;display:flex;gap:40px;align-items:center;color:var(--muted)}
.track span::after{content:"✦";color:var(--accent);font-style:normal}
@keyframes marq{to{transform:translateX(-50%)}}

/* blocos */
section{padding-block:64px 8px}
h2{font-family:var(--display);font-weight:var(--disp-w);font-style:var(--disp-style);text-transform:var(--disp-case);font-size:clamp(32px,5.5vw,52px);line-height:1;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 24px;max-width:56ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:-46px;position:relative;z-index:3}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.fact b{display:block;font:800 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:grid;transition:transform .25s,box-shadow .25s,border-color .25s}
.item:hover{transform:translateY(-6px);box-shadow:0 22px 46px rgba(0,0,0,.22);border-color:var(--accent)}
.item .ph{height:140px;background:radial-gradient(120% 90% at 30% 20%,var(--hero2),var(--hero1));display:grid;place-items:center;position:relative;overflow:hidden}
.item .ph svg{width:58px;height:58px;color:var(--accent);transition:transform .4s}
.item:hover .ph svg{transform:scale(1.18) rotate(-6deg)}
.item .ph em{position:absolute;left:12px;top:12px;font:800 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.35);color:#fff;padding:5px 8px;border-radius:99px;font-style:normal}
.item .in{padding:14px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item h3{margin:0;font-size:17px}
.item small{color:var(--muted)}
.item button{cursor:pointer;border:0;background:var(--accent);color:var(--accent-ink);border-radius:11px;padding:10px 14px;font:800 13px/1 var(--body);white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.stp{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative}
.stp::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:800 20px/1 var(--display);margin-bottom:14px}
.stp b{display:block;font-size:18px;margin-bottom:4px}
.stp p{margin:0;color:var(--muted);font-size:15px}
.chat{margin-top:12px;background:#0b141a;border-radius:14px;padding:10px;display:grid;gap:6px;font-size:13px}
.chat div{background:#005c4b;color:#e9edef;border-radius:10px 10px 2px 10px;padding:7px 10px;justify-self:end;max-width:90%}
.score{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px}
@media (max-width:560px){.score{grid-template-columns:1fr}}
.score .big{font-family:var(--display);font-weight:var(--disp-w);font-size:84px;line-height:.9}
.score .stars{font-size:26px;letter-spacing:4px}
.loc{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media (max-width:700px){.loc{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.hours{display:grid;gap:8px}
.hours div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.hours div.today{color:var(--accent);font-weight:800}
/* 20% */
.locked{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lk{position:relative;background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:20px;min-height:120px;overflow:hidden}
.lk .bl{filter:blur(5px);opacity:.55}
.lk .bl i{display:block;height:12px;border-radius:6px;background:var(--line);margin-top:10px}
.lk .bl i:nth-child(2){width:70%}.lk .bl i:nth-child(3){width:45%}
.lk span{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;font-weight:800;padding:12px}
.lk span svg{width:26px;height:26px;color:var(--accent)}
.final{margin-top:28px;background:linear-gradient(135deg,var(--prime),#14b86b);color:#fff;border-radius:26px;padding:28px;display:grid;gap:14px;position:relative;overflow:hidden}
.final h3{font:800 clamp(26px,4.5vw,38px)/1.05 'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.02em}
.final p{margin:0;opacity:.9}
.final .meter{height:12px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.final .meter i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
.final.in .meter i{width:20%}
.pdfbox{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.pdfbox .pdfic{width:52px;height:52px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.pdfbox .pdfic svg{width:28px;height:28px}
.pdfbox b{font-size:18px}
.pdfbox p{margin:6px 0 14px;color:var(--muted)}
.pdfbox button:disabled{opacity:.6}
@media (max-width:560px){.pdfbox{grid-template-columns:1fr}}
.final a{justify-self:start;background:#fff;color:#0b5e36;border-radius:14px;padding:15px 22px;font-weight:800;text-decoration:none}
footer{padding-block:48px 120px;color:var(--muted);text-align:center;font-size:14px}

/* abertura */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;align-content:center;gap:16px;text-align:center;padding:24px;transition:opacity .5s,visibility .5s}
.splash.fora{opacity:0;visibility:hidden}
.splash b{font:800 18px/1.3 var(--body);color:var(--ink)}
.splash small{color:var(--muted);font-weight:600}
.splash .ld{width:200px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.splash .ld i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;animation:carrega 1.1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes carrega{to{width:100%}}
.mono{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 24px/1 var(--display);font-style:var(--disp-style);box-shadow:0 14px 40px color-mix(in srgb,var(--accent) 45%,transparent)}
.splash .mono{animation:popin .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:scale(.3) rotate(-20deg);opacity:0}}
/* progresso da leitura */
.sprog{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;pointer-events:none}
.sprog i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
/* topo do site */
.topnav{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.topnav .mono{width:44px;height:44px;border-radius:14px;font-size:17px;box-shadow:none}
.topnav strong{font:800 16px/1.15 var(--body);max-width:22ch}
.topnav nav{margin-left:auto;display:flex;gap:22px;font-weight:700;font-size:14px}
.topnav nav a{white-space:nowrap;text-decoration:none;color:var(--muted);position:relative}
.topnav nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .25s}
.topnav nav a:hover{color:var(--ink)}.topnav nav a:hover::after{transform:scaleX(1)}
@media (max-width:760px){.topnav nav{display:none}}
/* palco 3D */
.stage{position:absolute;right:2%;top:150px;transform:none;width:min(44vw,460px);aspect-ratio:1;z-index:1}
.stage canvas{width:100%;height:100%;display:block}
.stage .alt{position:absolute;inset:0;display:grid;place-items:center}
.stage .alt svg{width:86%;height:86%}
.stage.on3d .alt{display:none}

<script>/* ===================== área real do negócio =====================
   A pesquisa classifica cada empresa por uma palavra-chave da fonte (às vezes errada: "Botoclinic" como estética,
   "Epilação" como estética, "Centro Educacional" como harmonização). Aqui a área é decidida lendo o NOME, depois a
   CATEGORIA da ficha e só por último o nicho gravado. Usado pelo app (filtros, mensagens, link) e pela demonstração,
   para que a demonstração seja sempre da área da pessoa. Arquivo sem dependências: roda no app e na demonstração. */
(function (raiz) {
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  // áreas fortes: ganham de qualquer outra palavra no nome
  const FORTES = [
    ['harmonizacao', /harmoniza|harmony|botox|btox|botulin|bioestimul|preenchimento|orofacial|rejuvenescimento|endoskin|cirurgia (estetica )?facial|toxina|botopremium|botoclinic|botocenter/],
    ['odonto', /odont|dentis|dental|ortodon|sorria|sorrind/],
  ];
  // demais áreas: vale a que aparece primeiro no nome
  const ORDEM = [
    ['depilacao', /depila|epila/],
    ['manicure', /manicure|\bnails?\b|unha|esmalt/],
    ['sobrancelha', /sobrancel|\bbrow|cilios|\blash|micropigment|eyebrow/],
    ['barbearia', /barbe|barber/],
    ['maquiagem', /maquia|make ?up|penteadista|visagis/],
    ['salao', /salao|cabelei|\bhair|coiffeur|mechas|capilar|cabelo|cacheadu|loiros?\b/],
    ['estetica', /estetic|corporal|drenagem|massag|criolip|emagrec|limpeza de pele|\bskin|facial/],
  ];
  const CATEGORIA = [
    // só vale o começo do texto: a fonte cola endereço e outras coisas depois da categoria
    ['barbearia', /^barbearia/], ['depilacao', /^(servico de )?depila/], ['manicure', /^(r\$ [\d–-]+ · )?manicure/], ['sobrancelha', /^salao de sobrancelha/],
    ['maquiagem', /^estudio de maquiagem/], ['salao', /^(cabeleireiro|salao de beleza)/], ['odonto', /^(dentista|cirurgiao dentista|clinica odontolog)/],
    ['estetica', /^(esteticista|centro estetico|spa facial|servico de emagrec)/],
    ['saude', /^(medico|clinica de dermatolog|consultorio medico|centro medico|grupo medico|enfermeiro|nutricionista)/], ['geral', /^centro educacional/],
  ];
  const GENERICO = { 'salao de beleza': 1, 'clinica de estetica': 1 };
  const NICHO = { 'barbearia': 'barbearia', 'salao de beleza': 'salao', 'design de sobrancelha': 'sobrancelha', 'clinica de estetica': 'estetica', 'estetica facial': 'estetica', 'harmonizacao facial': 'harmonizacao', 'depilacao': 'depilacao', 'manicure': 'manicure', 'esmalteria': 'manicure', 'clinica odontologica': 'odonto', 'maquiagem': 'maquiagem' };
  const COMIDA = /hamburg|pizza|lanchon|restaurante|marmit|acai|padaria|confeit|doceria|cafeteria|sorvet|churrasc|japones/;
  const primeiro = (nome, lista) => { let melhor = null; for (const [k, re] of lista) { const m = re.exec(nome); if (m && (!melhor || m.index < melhor[1])) melhor = [k, m.index]; } return melhor && melhor[0]; };

  function areaDe(l) {
    const nome = norm(l.nome), cat = norm(l.categoria), nic = norm(l.nicho);
    for (const [k, re] of FORTES) if (re.test(nome)) return k;
    const doNome = primeiro(nome, ORDEM); if (doNome) return doNome;
    if (/academy|curso|escola|treinamento|faculdade/.test(nome)) return 'geral';
    if (/medic|dermatolog|nutri/.test(nome)) return 'saude';
    if (NICHO[nic] && !GENERICO[nic]) return NICHO[nic];   // a pesquisa foi feita por aquele termo: vale mais que categoria genérica de salão
    let k2 = null; for (const [k, re] of CATEGORIA) if (re.test(cat)) { k2 = k; break; }
    if (k2 === 'salao' && /clinic/.test(nome)) return 'estetica';
    if (k2) return k2;
    if (NICHO[nic]) return NICHO[nic];
    if (COMIDA.test(nic + ' ' + cat + ' ' + nome)) return 'comida';
    return 'geral';
  }
  const AREA_NOME = { barbearia: 'Barbearia', salao: 'Salão de beleza', sobrancelha: 'Design de sobrancelha', manicure: 'Manicure', depilacao: 'Depilação', estetica: 'Clínica de estética', harmonizacao: 'Harmonização facial', odonto: 'Clínica odontológica', maquiagem: 'Maquiagem', saude: 'Clínica médica', comida: 'Alimentação', geral: 'Outro' };
  // prefixo dos estilos da Biblioteca de estilos que servem de paleta e fonte para cada área
  const AREA_ESTILO = { barbearia: 'bar', salao: 'sal', sobrancelha: 'sal', manicure: 'sal', depilacao: 'sal', maquiagem: 'sal', estetica: 'sal', harmonizacao: 'odo', odonto: 'odo', saude: 'odo', geral: 'odo' };
  raiz.areaDe = areaDe; raiz.AREA_NOME = AREA_NOME; raiz.AREA_ESTILO = AREA_ESTILO;
  if (typeof module !== 'undefined') module.exports = { areaDe, AREA_NOME, AREA_ESTILO };
})(typeof window !== 'undefined' ? window : globalThis);

        <div><b>Quer ver tudo com calma?</b><p>Baixe a proposta em PDF: 3 páginas com o que percebemos sobre a ${esc(nome)}, o que entra no site, como funciona, os valores e um QR code pra voltar nesta demonstração. Dá pra salvar ou mandar pro sócio.</p><button class="btn main" id="pdfbtn" type="button">Baixar proposta em PDF</button> <button class="btn" id="demopdf" type="button" style="background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)">Baixar esta demonstração em PDF</button></div>

  </div>
  <footer class="pro"><div class="wrap"><div class="cols">

    <div><h4>Contato</h4><p><a href="#" data-wa>WhatsApp</a></p>${L.tel ? `<p>${esc(L.tel)}</p>` : ''}<p>${esc(L.end || bairro || [L.cidade, L.uf].filter(Boolean).join(' - '))}</p>${pags ? `<p>${esc(pags)}</p>` : ''}</div>
  </div><div class="base"><span>© ${new Date().getFullYear()} ${esc(nome)} · ${esc(dominio)}</span><span>Site feito pela <a href="${quero}" target="_blank" rel="noopener"><b>Prime Site</b></a> · demonstração · fotos ilustrativas</span></div></div></footer>`;
  // menu fixo que aparece depois do topo
  const sh = document.createElement('div'); sh.className = 'shead'; sh.innerHTML = `<div class="wrap"><div class="mono">${esc(iniciais)}</div><strong>${esc(nome)}</strong><nav><a href="#itens">${esc(secTitle)}</a><a href="#como">${beleza ? 'Agendar' : 'Como pedir'}</a>${L.nota ? '<a href="#aval">Avaliações</a>' : ''}<a href="#horario">Horário</a></nav><button class="btn main" data-wa type="button">${waIco}<span>${beleza ? 'Agendar' : 'Pedir agora'}</span></button></div>`; document.body.appendChild(sh);
  const ajustaBar = () => document.documentElement.style.setProperty('--barh', $('bar').offsetHeight + 'px'); ajustaBar(); addEventListener('resize', ajustaBar);
  const heroEl = document.querySelector('header.hero');
  addEventListener('scroll', () => sh.classList.toggle('on', scrollY > (heroEl ? heroEl.offsetHeight - 80 : 500)), { passive: true });

  // seletor de fontes
  OPF.forEach(carregaFonte);
  const fbtn = document.createElement('button'); fbtn.className = 'fontbtn'; fbtn.type = 'button'; fbtn.innerHTML = '<b>Aa</b> Fontes';
  const fpan = document.createElement('div'); fpan.className = 'fontpan'; fpan.hidden = true;
  fpan.innerHTML = '<p>Escolha a letra do seu site</p>' + OPF.map((F, i) => `<button type="button" class="fopt" data-f="${i}" aria-pressed="${i === fonteIni}"><span style="font-family:'${F[0]}';font-weight:${F[1]};font-style:${F[2]};text-transform:${F[3]}">${esc(nome.split(' ').slice(0, 2).join(' '))}</span><small><em style="font-family:'${F[4]}'">${F[6]}</em></small></button>`).join('');
  document.body.append(fbtn, fpan);
  fbtn.onclick = () => { fpan.hidden = !fpan.hidden; };
  fpan.addEventListener('click', e => { const o = e.target.closest('.fopt'); if (!o) return; aplicaFonte(+o.dataset.f); toast('Fonte "' + OPF[+o.dataset.f][6] + '" aplicada. Dá pra trocar quando quiser.'); });
  // sacola de pedido (comida)
  const sacola = [];
  const bag = document.createElement('div'); bag.className = 'bag'; bag.innerHTML = '<span class="n">0</span><div><span id="bagT">Seu pedido</span><small id="bagI"></small></div><button type="button">Enviar pedido</button>'; document.body.appendChild(bag);
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    sacola.push(b.dataset.add); const n = sacola.length;
    bag.querySelector('.n').textContent = n; $('bagT').textContent = n === 1 ? '1 item no pedido' : n + ' itens no pedido'; $('bagI').textContent = sacola.slice(-3).join(', ');
    bag.classList.add('on'); document.body.classList.add('tem-bag'); bag.classList.remove('pula'); void bag.offsetWidth; bag.classList.add('pula');
    if (b.classList.contains('mais')) { b.classList.add('ok'); b.textContent = '✓'; setTimeout(() => { b.classList.remove('ok'); b.textContent = '+'; }, 900); }
  }));
  bag.querySelector('button').addEventListener('click', () => toast(`No site final, o pedido vai pronto pro WhatsApp da ${nome}: ${sacola.join(', ')}.`));
  // títulos entrando palavra por palavra
  if (!REDUZ) document.querySelectorAll('h2.rv').forEach(h => { let k = 0; const quebra = n => { [...n.childNodes].forEach(c => { if (c.nodeType === 3) { const fr = document.createDocumentFragment(); c.textContent.split(/(\s+)/).forEach(p => { if (!p) return; if (/^\s+$/.test(p)) fr.appendChild(document.createTextNode(p)); else { const s = document.createElement('span'); s.className = 'sw'; s.style.setProperty('--k', k++); s.textContent = p; fr.appendChild(s); } }); c.replaceWith(fr); } else if (c.nodeType === 1) quebra(c); }); }; quebra(h); });
  // pílulas aparecendo uma a uma
  const pl = [...document.querySelectorAll('#pills .pill')];
  if (REDUZ) pl.forEach(p => p.classList.add('on')); else pl.forEach((p, k) => setTimeout(() => p.classList.add('on'), 1700 + k * 900));
  // abas do cardápio
  document.querySelectorAll('.abas button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.abas button').forEach(x => x.setAttribute('aria-selected', x === b));
    const c = b.dataset.aba; document.querySelectorAll('.items .item').forEach(it => { const mostra = c === 'Todos' || it.dataset.cat === c; it.classList.toggle('esc', !mostra); });
  }));
  // antes e depois
  const ad = $('ad');
  if (ad) { const r = ad.querySelector('input'); const set = v => ad.style.setProperty('--p', v + '%'); r.addEventListener('input', () => set(r.value));
    if (!REDUZ && 'IntersectionObserver' in window) { const o = new IntersectionObserver(es => { if (!es[0].isIntersecting) return; o.disconnect(); let k = 0; const t0 = performance.now(); (function f(t) { const p = Math.min(1, (t - t0) / 2200); const v = 50 + Math.sin(p * Math.PI * 2) * 30 * (1 - p); set(v.toFixed(1)); r.value = v; if (p < 1) requestAnimationFrame(f); })(t0); }, { threshold: .5 }); o.observe(ad); } }
  // encomenda de bolo
  const enc = $('enc');
  if (enc) { const ch = {}; const grp = g => enc.querySelector(`[data-grp="${g}"]`); const passo = n => enc.querySelectorAll('[data-ap]').forEach(s => s.classList.toggle('on', +s.dataset.ap <= n));
    enc.addEventListener('click', e => { const b = e.target.closest('.opt'); if (!b) return; const g = b.parentElement.dataset.grp; b.parentElement.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (g === 'd') { const v = enc.querySelector('input[type=date]').value; ch.d = v ? v.split('-').reverse().join('/') : ''; } else ch[g] = b.dataset.v;
      if (g === 't') { grp('m').hidden = false; passo(2); } if (g === 'm') { grp('r').hidden = false; passo(3); } if (g === 'r') { grp('d').hidden = false; passo(4); } if (g === 'd') enc.querySelector('.resumo').hidden = false;
      if (ch.t && ch.m && ch.r && ch.d) $('encRes').textContent = `Bolo ${ch.t} · ${ch.m} · recheio de ${ch.r} · para ${ch.d}`; });
    $('encBtn').addEventListener('click', () => toast(`No site final, a encomenda vai pro WhatsApp da ${nome}: ${$('encRes').textContent}.`)); }
  // agendamento por passos
  const ag = $('agenda');
  if (ag) {
    const esc2 = {}; const grp = g => ag.querySelector(`[data-grp="${g}"]`);
    const passo = n => ag.querySelectorAll('[data-ap]').forEach(s => s.classList.toggle('on', +s.dataset.ap <= n));
    ag.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const g = b.parentElement.dataset.grp; b.parentElement.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); esc2[g] = b.dataset.v;
      if (g === 's') { grp('d').hidden = false; passo(2); }
      if (g === 'd') { grp('h').hidden = false; passo(3); }
      if (g === 'h') { ag.querySelector('.resumo').hidden = false; passo(4); }
      if (esc2.s && esc2.d && esc2.h) $('resumo').textContent = `${esc2.s} · ${esc2.d} às ${esc2.h}`;
    });
  }
  // busca do Google sendo digitada
  const gs = $('gsim');
  if (gs) { const rodaG = () => { const q = $('gq'); let k = 0; const t = setInterval(() => { q.textContent = busca.slice(0, ++k); if (k >= busca.length) { clearInterval(t); setTimeout(() => gs.querySelector('.gres.top').classList.add('on'), 350); setTimeout(() => gs.querySelector('.gres.dim').classList.add('on'), 800); } }, REDUZ ? 0 : 55); };
    if (REDUZ || !('IntersectionObserver' in window)) rodaG(); else { const o = new IntersectionObserver(es => { if (es[0].isIntersecting) { rodaG(); o.disconnect(); } }, { threshold: .5 }); o.observe(gs); } }

  // botões de pedido: na demo só explicam
  document.querySelectorAll('a[data-wa]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  const aviso = () => toast(`No site final, este botão abre o WhatsApp da ${nome} com a mensagem pronta.`);
  document.querySelectorAll('[data-wa]').forEach(b => b.addEventListener('click', aviso));
  $('fab').addEventListener('click', aviso);
  // 3D: carrega o three.js e liga o palco e as fatias; se falhar, fica o desenho
  if (usa3D) D3.load().then(() => {
    D3.heroi($('c3d'), MODELO);
    document.querySelectorAll('[data-fatia]').forEach(c => D3.fatia(c, c.dataset.fatia));
  }).catch(() => {
    if ($('stage')) $('stage').remove(); if ($('c3d')) $('c3d').remove();
    document.querySelectorAll('[data-fatia]').forEach(c => { c.outerHTML = fatiaSVG(c.dataset.fatia); });
    $('t3d').lastChild.textContent = '3D indisponível';
  });
  if ($('t3d')) $('t3d').onclick = () => { try { localStorage.setItem('demo3d', usa3D ? '0' : '1'); } catch (e) {} if (!usa3D && REDUZ) toast('Seu aparelho está com "reduzir movimento" ligado: o 3D fica desligado.'); else location.reload(); };
  // barra de leitura + profundidade no topo
  const blobs = document.querySelectorAll('.blob');
  const onScroll = () => { const h = document.documentElement; const k = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight); $('sprog').style.transform = `scaleX(${k})`; if (!REDUZ) blobs.forEach((b, i) => { b.style.translate = `0 ${h.scrollTop * (i ? .25 : .15)}px`; }); };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  // cartões que inclinam com o mouse
  if (!REDUZ && matchMedia('(pointer:fine)').matches) document.querySelectorAll('.item, .tilt, .fact').forEach(c => {
    c.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; c.style.transform = `perspective(700px) rotateX(${-y * 7}deg) rotateY(${x * 9}deg) translateY(-4px)`; });
    c.addEventListener('pointerleave', () => { c.style.transform = ''; });
  });
  // faíscas no clique dos botões
  const faisca = e => { if (REDUZ) return; for (let i = 0; i < 14; i++) { const s = document.createElement('i'); s.className = 'fx'; const a = Math.random() * 6.28, d = 40 + Math.random() * 50; s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px'; s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d + 'px'); document.body.appendChild(s); setTimeout(() => s.remove(), 750); } };
  document.querySelectorAll('[data-wa], .btn.main, .final a').forEach(b => b.addEventListener('click', faisca));
  // conversa do WhatsApp acontecendo
  const chat = $('chat');
  if (chat) { const msgs = chat.querySelectorAll('.m'), dig = chat.querySelector('.dig'); const roda = () => { msgs[0].classList.add('on'); setTimeout(() => dig.classList.add('on'), 700); setTimeout(() => { dig.classList.remove('on'); msgs[1].classList.add('on'); }, 2000); setTimeout(() => msgs[2].classList.add('on'), 3000); };
    if (REDUZ || !('IntersectionObserver' in window)) msgs.forEach(m => m.classList.add('on')); else { const o = new IntersectionObserver(es => { if (es[0].isIntersecting) { roda(); o.disconnect(); } }, { threshold: .6 }); o.observe(chat); } }
  document.querySelectorAll('.tip b').forEach((b, i) => { b.textContent = i + 1; });
  // proposta em PDF
  $('pdfbtn').onclick = async e => {
    const b = e.currentTarget, txt = b.textContent; b.disabled = true; b.textContent = 'Gerando o PDF…';
    try { await gerarProposta(L_PDF || L, { primeWa: PRIME_WA, plans: PLAN && PLAN.pl, ps: PLAN && PLAN.ps }, /^https?:$/.test(location.protocol) ? location.href : ''); toast('PDF baixado! Procure em Downloads.'); }
    catch (err) { toast('Não deu pra gerar o PDF agora. Confira a internet e tente de novo.'); }
    b.disabled = false; b.textContent = txt;
  };
  // demonstração em PDF: o navegador salva a própria página (escolha "Salvar como PDF")
  const salvarPdf = () => {
    document.documentElement.classList.add('imprimindo');
    document.querySelectorAll('.rv').forEach(x => x.classList.add('in')); document.querySelectorAll('img[loading="lazy"]').forEach(i => i.loading = 'eager');
    document.querySelectorAll('.up,.w').forEach(x => { x.style.opacity = 1; x.style.transform = 'none'; });
    toast('Na janela que abrir, escolha "Salvar como PDF".');
    const fim = () => { document.documentElement.classList.remove('imprimindo'); removeEventListener('afterprint', fim); };
    addEventListener('afterprint', fim); setTimeout(() => window.print(), 900);
  };
  $('demopdf').onclick = salvarPdf;
  if (params.get('pdf') === '1') setTimeout(salvarPdf, 2500);
  // explicações liga/desliga
  $('tipsbtn').onclick = () => { const off = document.body.classList.toggle('no-tips'); $('tipsbtn').textContent = off ? 'Mostrar explicações' : 'Esconder explicações'; };
  // estrelas e contadores
  const startCounts = el => { const n = +el.dataset.n || 0, dec = +el.dataset.dec || 0, fmt = v => dec ? (v / 10).toFixed(1).replace('.', ',') : v.toLocaleString('pt-BR'); if (REDUZ || !n) { el.textContent = fmt(n); return; } const t0 = performance.now(), dur = 1400; (function f(t) { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(n * e)); if (k < 1) requestAnimationFrame(f); })(t0); };
  const fill = el => el.style.setProperty('--pct', el.dataset.pct);
  // revela ao rolar
  const io = 'IntersectionObserver' in window && !REDUZ ? new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const el = e.target; el.classList.add('in'); el.querySelectorAll('.stars').forEach(fill); el.querySelectorAll('.count').forEach(startCounts); io.unobserve(el); }), { threshold: .15 }) : null;
  document.querySelectorAll('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in'));
  // o que está no topo anima já
  setTimeout(() => { document.querySelectorAll('.hero .stars').forEach(fill); document.querySelectorAll('.hero .count').forEach(startCounts); }, REDUZ ? 0 : 700);
  if (!io) { document.querySelectorAll('.stars').forEach(fill); document.querySelectorAll('.count').forEach(startCounts); }
}
